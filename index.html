<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sloptris</title>
<meta name="description" content="Offline Tetris. Install it and play anywhere.">
<meta name="theme-color" content="#1b1c1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sloptris">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="tile mini" id="holdBox"><small>Hold</small><canvas id="hold" width="128" height="80"></canvas></div>
    <div class="tile" id="stats">
      <div class="score"><small>Score</small><b id="score">0</b></div>
      <div class="row"><small>Level</small><b id="level">1</b></div>
      <div class="row"><small>Lines</small><b id="lines">0</b></div>
    </div>
    <div class="tile mini"><small>Next</small><canvas id="next" width="128" height="80"></canvas></div>
    <div id="btns">
      <button id="pauseBtn" aria-label="Pause"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <button id="muteBtn" aria-label="Mute"></button>
    </div>
  </header>

  <main id="stage">
    <canvas id="board"></canvas>
    <div id="hint"></div>
  </main>

  <footer id="pad">
    <button data-a="left" aria-label="Left"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button data-a="right" aria-label="Right"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button data-a="rotate" aria-label="Rotate"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.2-5.1"/><path d="M19 4v5h-5"/></svg></button>
    <button data-a="hold" aria-label="Hold"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h13M14 4l4 4-4 4M19 16H6M10 12l-4 4 4 4"/></svg></button>
    <button data-a="drop" class="drop" aria-label="Drop"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M6 11l6 6 6-6M5 21h14"/></svg></button>
  </footer>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
